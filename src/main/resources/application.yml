server:
  port: 8080

#mysql
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource            # 当前数据源操作类型
    driver-class-name: com.mysql.cj.jdbc.Driver              # mysql驱动包
    url: jdbc:mysql://127.0.0.1:3306/example?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
    username: root
    password: root
#    driver-class-name: com.mysql.jdbc.Driver

#mybatis-plus
mybatis-plus:
  mapper-locations: classpath:com/xiaofeng/plus/*/mapper/xml/*.xml
  global-config:
    db-config:
      id-type: id_worker
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-enums-package: com.xiaofeng.enums
#  global-config:
#    db-column-underline: true # true 驼峰与下划线转换
#    id-type: 2 # 全局配置id生成策略 0: 自增 ,2: 分布式长整型id, 3: uuid


